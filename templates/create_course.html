<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Course - Ctrl + Teach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
        <h2 class="text-primary mb-4">Create a New Course</h2>
        <form method="POST" action="/tutor/course/create">
            <div class="mb-3">
                <label class="form-label">Course Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Conversational Japanese for Beginners" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Subject</label>
                <select name="subject_id" class="form-select" required>
                    <!-- This Jinja loop creates a dropdown option for every subject in the database -->
                    {% for subject in subjects %}
                        <option value="{{ subject.id }}">{{ subject.name }} ({{ subject.category }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Hourly Rate (₱)</label>
                <input type="number" name="hourly_rate" class="form-control" placeholder="e.g. 500" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Description (Syllabus, teaching style, etc.)</label>
                <textarea name="description" class="form-control" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Publish Course</button>
            <a href="/dashboard" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
