<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Session - Ctrl + Teach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h3 class="text-primary mb-3">Book: {{ course.title }}</h3>
        <p><strong>Tutor:</strong> {{ course.tutor.name }}</p>
        <p><strong>Rate:</strong> ₱{{ course.hourly_rate }}/hr</p>
        
        <form method="POST">
            <div class="mb-4">
                <label class="form-label">Select Date & Time</label>
                <input type="datetime-local" name="schedule_date" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Proceed to Payment</button>
            <a href="/explore" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
