<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GCash Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f4f6f9; }
        .slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .gcash-card { border-radius: 20px; border-top: 8px solid #0056FF; box-shadow: 0 20px 40px rgba(0,86,255,0.1); }
        .btn-gcash { background: #0056FF; color: white; border-radius: 30px; transition: transform 0.2s; }
        .btn-gcash:hover { background: #0045cc; transform: scale(1.05); color: white; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
<div class="container slide-up">
    <div class="card gcash-card mx-auto text-center bg-white p-2" style="max-width: 420px;">
        <div class="card-body p-4">
            <!-- Simulated GCash Logo / Header -->
            <div class="mb-4 d-flex align-items-center justify-content-center">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width:40px; height:40px;">
                    <i class="fas fa-wallet"></i>
                </div>
                <h2 class="mb-0" style="color: #0056FF; font-weight: 800; letter-spacing: -1px;">GCash</h2>
            </div>
            
            <div class="bg-light rounded-4 p-4 mb-4">
                <p class="text-muted mb-1 text-uppercase small fw-bold">Total Amount Due</p>
                <h1 class="display-4 fw-bold text-dark mb-0">₱{{ booking.course.hourly_rate }}</h1>
            </div>
            
            <div class="text-start mb-4 px-2">
                <p class="mb-1 text-muted small">Merchant</p>
                <h6 class="fw-bold mb-3"><i class="fas fa-store text-primary me-2"></i>Ctrl + Teach Tutoring Services</h6>
                
                <p class="mb-1 text-muted small">Reference Item</p>
                <h6 class="fw-bold"><i class="fas fa-book-open text-success me-2"></i>{{ booking.course.title }}</h6>
            </div>
            
            <form method="POST">
                <button type="submit" class="btn btn-gcash btn-lg w-100 fw-bold py-3 shadow-sm">Pay ₱{{ booking.course.hourly_rate }}</button>
            </form>
            <p class="mt-3 mb-0 small text-muted"><i class="fas fa-lock me-1"></i> Secure Payment Simulation</p>
        </div>
    </div>
</div>
</body>
</html>
