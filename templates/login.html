<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - Ctrl + Teach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .bg-image { background: url('https://images.unsplash.com/photo-1513258496099-48162020272b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') center/cover; }
        .btn-hover { transition: transform 0.2s; }
        .btn-hover:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid vh-100 fade-in">
    <div class="row h-100">
        <div class="col-md-6 bg-image d-none d-md-block"></div>
        <div class="col-md-6 d-flex align-items-center justify-content-center">
            <div class="card shadow border-0 p-5 w-75 rounded-4">
                <h2 class="text-center mb-4 text-primary fw-bold">Welcome Back</h2>
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label text-muted">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 btn-hover rounded-pill">Log In</button>
                </form>
                <p class="text-center mt-4"><a href="/register" class="text-decoration-none text-secondary">Need an account? <strong>Register</strong></a></p>
                <p class="text-center mt-2"><a href="/" class="text-decoration-none text-muted small">← Back to Home</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
